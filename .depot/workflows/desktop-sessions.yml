# Depot CI Migration
# Source: .github/workflows/desktop-sessions.yml
#
# Changes made:
# - Run on depot-ubuntu-latest. Depot CI has no macOS/Windows sandboxes, and
#   ${{ matrix.os }} (macos-15 / windows-latest) cannot schedule here.
# - Build the pinned WASM engine before Studio npm test so
#   rhwp/pkg/rhwp.js and rhwp/pkg/rhwp_bg.wasm exist for browser merge tests.
# - Install Google Chrome and set PUPPETEER_EXECUTABLE_PATH for those tests.
# - Raise the timeout to 90 minutes so the WASM compile fits.

name: Desktop session checks
on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
permissions:
  contents: read
concurrency:
  group: desktop-sessions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  session-tests:
    name: Session tests (depot-ubuntu-latest)
    runs-on: depot-ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json
      - name: Install pinned Rust toolchain for browser merge tests
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack for browser merge tests
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build WASM engine for browser merge tests
        working-directory: rhwp
        run: wasm-pack build --target web
      - name: Install Google Chrome for browser merge tests
        run: |
          set -euo pipefail
          if [ -x /usr/bin/google-chrome ]; then
            echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -x /usr/bin/chromium ]; then
            echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/chrome.deb
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/chrome.deb
          echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          npm --prefix rhwp/rhwp-agent ci
          npm --prefix rhwp/rhwp-studio ci
      - name: Check desktop and hub syntax
        shell: bash
        run: |
          node --check desktop/main.mjs
          node --check desktop/agent-hub.mjs
          node --check desktop/session-manager.mjs
          node --check rhwp/rhwp-agent/server.mjs
      - name: Test agent hub and process lifecycle
        run: npm --prefix rhwp/rhwp-agent test
      - name: Test Studio session persistence and desktop contracts
        run: npm --prefix rhwp/rhwp-studio test
