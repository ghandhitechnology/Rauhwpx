# Depot CI copy of .github/workflows/desktop-sessions.yml.
# Depot CI sandboxes are Ubuntu only. Keep GitHub-hosted macOS/Windows session
# jobs in .github/workflows. Linux session tests run here with Chrome and a
# 90-minute timeout so wasm-pack plus Studio browser merge tests can finish.
# Linux packaging stays on Depot because electron-builder --linux needs a
# Linux sandbox; GitHub-hosted Linux session jobs were removed in #122.

name: Desktop session checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-sessions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-tests:
    name: Session tests (depot-ubuntu-latest)
    runs-on: depot-ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - name: Install pinned Rust toolchain for browser merge tests
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack for browser merge tests
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build WASM engine for browser merge tests
        working-directory: rhwp
        run: wasm-pack build --target web

      - name: Install Google Chrome for browser merge tests
        run: |
          set -euo pipefail
          if [ -x /usr/bin/google-chrome ]; then
            echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -x /usr/bin/chromium ]; then
            echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -x /usr/bin/chromium-browser ]; then
            echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/chrome.deb
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/chrome.deb
          if [ -x /usr/bin/google-chrome ]; then
            echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          elif [ -x /usr/bin/chromium ]; then
            echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium" >> "$GITHUB_ENV"
          elif [ -x /usr/bin/chromium-browser ]; then
            echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser" >> "$GITHUB_ENV"
          else
            echo "지원하는 브라우저 실행 파일을 찾지 못했습니다." >&2
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          npm --prefix rhwp/rhwp-agent ci
          npm --prefix rhwp/rhwp-studio ci

      - name: Check desktop and hub syntax
        shell: bash
        run: |
          node --check desktop/main.mjs
          node --check desktop/agent-hub.mjs
          node --check desktop/session-manager.mjs
          node --check rhwp/rhwp-agent/server.mjs

      - name: Test agent hub and process lifecycle
        run: npm --prefix rhwp/rhwp-agent test

      - name: Test Studio session persistence and desktop contracts
        run: npm --prefix rhwp/rhwp-studio test

  linux-packaging:
    name: Linux package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: depot-ubuntu-24.04
            arch: x64
          - runner: depot-ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build WASM engine
        working-directory: rhwp
        run: wasm-pack build --target web

      - name: Install root dependencies
        run: npm ci

      - name: Build AppImage and Debian package
        run: npm run dist:linux:${{ matrix.arch }}

      - name: Verify Linux artifacts
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ "${EXPECTED_ARCH}" = arm64 ]; then
            test -f release/Rauhwpx-*-arm64.AppImage
            test -f release/Rauhwpx-*-arm64.deb
            test -f release/latest-linux-arm64.yml
          else
            test -f release/Rauhwpx-*-x86_64.AppImage
            test -f release/Rauhwpx-*-amd64.deb
            test -f release/latest-linux.yml
          fi
