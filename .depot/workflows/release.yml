# Depot CI Migration
# Source: .github/workflows/release.yml
#
# Changes made:
# - Changed runs-on from "ubuntu-latest" to "depot-ubuntu-latest" throughout
# - DISABLED macos / windows installer jobs: Depot CI has no macOS or Windows
#   sandboxes. codesign, notarization, and electron-builder --mac/--win stay on
#   GitHub Actions (.github/workflows/release.yml).
# - DISABLED publish: a second gh release create would race the GitHub Actions
#   release workflow on the same tag.
# - Added a Linux verify job that builds the pinned WASM engine and Studio so
#   tagged source still gets a Depot CI gate.

name: Release desktop apps
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    name: Verify release tag
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
      - name: Require a version tag matching package.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${expected#v}." >&2
            exit 1
          fi
  verify:
    name: Verify tagged Studio build
    needs: preflight
    runs-on: depot-ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build WASM engine
        working-directory: rhwp
        run: wasm-pack build --target web
      - name: Install studio and desktop dependencies
        run: |
          npm ci
          npm --prefix rhwp/rhwp-studio ci
          npm --prefix rhwp/rhwp-agent ci --omit=dev
      - name: Build Studio
        run: npm --prefix rhwp/rhwp-studio run build
  macos:
    name: Build macOS installers
    if: false # DISABLED: Depot CI has no macOS sandboxes. Signed/notarized Mac installers stay on GitHub Actions.
    needs: preflight
    runs-on: depot-ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Skip native macOS release
        run: echo "macOS signing and notarization run only on GitHub Actions."
  windows:
    name: Build Windows installer
    if: false # DISABLED: Depot CI has no Windows sandboxes. Windows installers stay on GitHub Actions.
    needs: preflight
    runs-on: depot-ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Skip native Windows release
        run: echo "Windows installers run only on GitHub Actions."
  publish:
    name: Publish GitHub Release
    if: false # DISABLED: publishing stays on GitHub Actions to avoid a second gh release create on the same tag.
    needs: [macos, windows]
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip Depot publish
        run: echo "GitHub Releases are published by .github/workflows/release.yml."
