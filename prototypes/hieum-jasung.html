<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ㅎ 자성 — 숨결 / 파장 / 조율 / 여운</title>
<style>
  :root {
    --bg: #121316;
    --ink: #e8e6e1;
    --muted: #8b8880;
  }

  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Noto Sans KR", "Malgun Gothic", sans-serif;
  }

  body {
    display: grid;
    min-height: 100dvh;
    place-items: center;
    padding: 48px 24px;
  }

  .stage {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    justify-content: center;
    gap: 72px;
  }

  .glyph {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    color: var(--ink);
  }

  .glyph svg {
    display: block;
    width: 120px;
    height: 120px;
    overflow: visible;
  }

  .glyph figcaption {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    line-height: 1;
  }

  /* 획 사이 여유는 top↔mid 1.05u, mid↔ring 0.95u.
     모든 진폭은 최소 0.35u 여유가 남도록 잡아 서로 파고들지 않는다. */
  .top,
  .mid,
  .ring,
  .echo {
    fill: none;
    stroke: currentColor;
    stroke-width: 1;
    stroke-linecap: round;
    stroke-linejoin: round;
    transform-box: fill-box;
    transform-origin: center;
    will-change: transform;
  }

  .echo {
    stroke-width: 0.42;
    opacity: 0;
  }

  /* 1 숨결 — 세 획이 함께 들이쉬고 내쉰다. 위획이 먼저, ㅇ 이 마지막으로 따라온다 */
  .breath .top { animation: breath-top 3.6s linear infinite; }
  .breath .mid { animation: breath-mid 3.6s linear infinite; }
  .breath .ring { animation: breath-ring 3.6s linear infinite; }

  @keyframes breath-top {
    0%, 100% { transform: translateY(0) scaleX(1); }
    12% { transform: translateY(0.08px) scaleX(1.006); }
    26% { transform: translateY(0.26px) scaleX(1.022); }
    38% { transform: translateY(0.4px) scaleX(1.032); }
    48% { transform: translateY(0.44px) scaleX(1.035); }
    56% { transform: translateY(0.38px) scaleX(1.03); }
    68% { transform: translateY(0.14px) scaleX(1.01); }
    78% { transform: translateY(-0.07px) scaleX(0.992); }
    88% { transform: translateY(0.03px) scaleX(1.003); }
    95% { transform: translateY(-0.01px) scaleX(0.999); }
  }

  @keyframes breath-mid {
    0%, 100% { transform: translateY(0) scaleX(1); }
    16% { transform: translateY(0.05px) scaleX(1.008); }
    30% { transform: translateY(0.16px) scaleX(1.026); }
    42% { transform: translateY(0.24px) scaleX(1.038); }
    52% { transform: translateY(0.26px) scaleX(1.04); }
    60% { transform: translateY(0.22px) scaleX(1.034); }
    72% { transform: translateY(0.07px) scaleX(1.012); }
    82% { transform: translateY(-0.05px) scaleX(0.99); }
    91% { transform: translateY(0.02px) scaleX(1.003); }
  }

  @keyframes breath-ring {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    18% { transform: translateY(-0.06px) scale(1.005, 0.996); }
    32% { transform: translateY(-0.2px) scale(1.016, 0.987); }
    44% { transform: translateY(-0.32px) scale(1.026, 0.978); }
    54% { transform: translateY(-0.36px) scale(1.028, 0.976); }
    62% { transform: translateY(-0.3px) scale(1.023, 0.981); }
    74% { transform: translateY(-0.1px) scale(1.008, 0.994); }
    84% { transform: translateY(0.06px) scale(0.994, 1.007); }
    93% { transform: translateY(-0.02px) scale(1.002, 0.998); }
  }

  /* 2 파장 — 당김이 위 → 가운데 → ㅇ 으로 번지고, 되돌아오는 파도로 풀린다 */
  .ripple .top { animation: ripple-top 4.2s linear infinite; }
  .ripple .mid { animation: ripple-mid 4.2s linear infinite; }
  .ripple .ring { animation: ripple-ring 4.2s linear infinite; }

  @keyframes ripple-top {
    0%, 100% { transform: translateY(0) scaleX(1); }
    6% { transform: translateY(0.14px) scaleX(1.014); }
    13% { transform: translateY(0.34px) scaleX(1.03); }
    19% { transform: translateY(0.42px) scaleX(1.034); }
    26% { transform: translateY(0.3px) scaleX(1.022); }
    34% { transform: translateY(0.1px) scaleX(1.006); }
    42% { transform: translateY(-0.04px) scaleX(0.995); }
    52% { transform: translateY(0) scaleX(1); }
    74% { transform: translateY(-0.16px) scaleX(0.985); }
    82% { transform: translateY(-0.18px) scaleX(0.983); }
    90% { transform: translateY(0.04px) scaleX(1.004); }
    96% { transform: translateY(-0.01px) scaleX(0.999); }
  }

  @keyframes ripple-mid {
    0%, 100% { transform: translateY(0) scaleX(1); }
    12% { transform: translateY(0) scaleX(1); }
    19% { transform: translateY(0.1px) scaleX(1.016); }
    27% { transform: translateY(0.22px) scaleX(1.04); }
    33% { transform: translateY(0.24px) scaleX(1.044); }
    41% { transform: translateY(0.14px) scaleX(1.026); }
    49% { transform: translateY(0.02px) scaleX(1.004); }
    58% { transform: translateY(-0.03px) scaleX(0.994); }
    66% { transform: translateY(0) scaleX(1); }
    80% { transform: translateY(-0.12px) scaleX(0.982); }
    88% { transform: translateY(-0.13px) scaleX(0.981); }
    94% { transform: translateY(0.03px) scaleX(1.004); }
  }

  @keyframes ripple-ring {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    26% { transform: translateY(0) scale(1, 1); }
    33% { transform: translateY(-0.1px) scale(1.008, 0.993); }
    41% { transform: translateY(-0.26px) scale(1.022, 0.981); }
    47% { transform: translateY(-0.3px) scale(1.025, 0.978); }
    55% { transform: translateY(-0.18px) scale(1.014, 0.988); }
    63% { transform: translateY(-0.02px) scale(1.002, 0.998); }
    71% { transform: translateY(0.05px) scale(0.995, 1.006); }
    79% { transform: translateY(0) scale(1, 1); }
    88% { transform: translateY(0.08px) scale(0.992, 1.009); }
    95% { transform: translateY(-0.02px) scale(1.002, 0.998); }
  }

  /* 3 조율 — 가운뎃획이 축. 위·ㅇ 이 축으로 모였다 어긋나며 잦아든다.
     맞닿는 순간 획이 살짝 얇아져 겹침이 부드럽게 읽힌다 */
  .tune .top { animation: tune-top 3.8s linear infinite; }
  .tune .mid { animation: tune-mid 3.8s linear infinite; }
  .tune .ring { animation: tune-ring 3.8s linear infinite; }

  @keyframes tune-top {
    0%, 100% { transform: translateY(0) scaleX(1) rotate(0deg); stroke-width: 1; }
    9% { transform: translateY(0.07px) scaleX(1.006) rotate(-0.1deg); }
    21% { transform: translateY(0.26px) scaleX(1.02) rotate(-0.3deg); stroke-width: 0.985; }
    33% { transform: translateY(0.42px) scaleX(1.032) rotate(-0.44deg); }
    41% { transform: translateY(0.47px) scaleX(1.036) rotate(-0.4deg); stroke-width: 0.955; }
    47% { transform: translateY(0.46px) scaleX(1.035) rotate(-0.3deg); }
    56% { transform: translateY(0.28px) scaleX(1.02) rotate(0.18deg); stroke-width: 0.985; }
    64% { transform: translateY(-0.1px) scaleX(0.988) rotate(0.36deg); stroke-width: 1.01; }
    72% { transform: translateY(-0.14px) scaleX(0.985) rotate(0.28deg); }
    80% { transform: translateY(0.04px) scaleX(1.005) rotate(-0.08deg); stroke-width: 1; }
    88% { transform: translateY(0.05px) scaleX(1.006) rotate(-0.05deg); }
    95% { transform: translateY(-0.02px) scaleX(0.998) rotate(0.02deg); }
  }

  @keyframes tune-mid {
    0%, 100% { transform: scaleX(1); stroke-width: 1; }
    12% { transform: scaleX(1.008); }
    24% { transform: scaleX(1.026); stroke-width: 0.99; }
    36% { transform: scaleX(1.044); }
    44% { transform: scaleX(1.05); stroke-width: 0.96; }
    52% { transform: scaleX(1.046); }
    60% { transform: scaleX(1.028); stroke-width: 0.99; }
    68% { transform: scaleX(0.988); stroke-width: 1.012; }
    76% { transform: scaleX(0.986); }
    85% { transform: scaleX(1.004); stroke-width: 1; }
    93% { transform: scaleX(0.998); }
  }

  @keyframes tune-ring {
    0%, 100% { transform: translateY(0) scale(1, 1) rotate(0deg); stroke-width: 1; }
    11% { transform: translateY(-0.05px) scale(1.004, 0.997) rotate(0.1deg); }
    23% { transform: translateY(-0.2px) scale(1.016, 0.987) rotate(0.26deg); stroke-width: 0.99; }
    35% { transform: translateY(-0.35px) scale(1.028, 0.976) rotate(0.4deg); }
    43% { transform: translateY(-0.4px) scale(1.032, 0.972) rotate(0.36deg); stroke-width: 0.962; }
    49% { transform: translateY(-0.39px) scale(1.03, 0.974) rotate(0.26deg); }
    58% { transform: translateY(-0.23px) scale(1.017, 0.986) rotate(-0.14deg); stroke-width: 0.99; }
    66% { transform: translateY(0.11px) scale(0.99, 1.011) rotate(-0.32deg); stroke-width: 1.012; }
    74% { transform: translateY(0.14px) scale(0.987, 1.014) rotate(-0.24deg); }
    82% { transform: translateY(-0.04px) scale(1.004, 0.996) rotate(0.06deg); stroke-width: 1; }
    90% { transform: translateY(-0.05px) scale(1.005, 0.995) rotate(0.04deg); }
    96% { transform: translateY(0.02px) scale(0.998, 1.002) rotate(-0.02deg); }
  }

  /* 4 여운 — 조율과 같은 결이지만, 맞닿는 순간 흔적이 번지고
     세 획이 각기 다른 속도로 잦아든다 */
  .resonate .top { animation: resonate-top 4.4s linear infinite; }
  .resonate .mid { animation: resonate-mid 4.4s linear infinite; }
  .resonate .ring { animation: resonate-ring 4.4s linear infinite; }
  .resonate .echo-a { animation: resonate-echo-a 4.4s linear infinite; }
  .resonate .echo-b { animation: resonate-echo-b 4.4s linear infinite; }

  @keyframes resonate-top {
    0%, 100% { transform: translateY(0) scaleX(1); stroke-width: 1; }
    10% { transform: translateY(0.09px) scaleX(1.007); }
    22% { transform: translateY(0.3px) scaleX(1.022); stroke-width: 0.985; }
    32% { transform: translateY(0.44px) scaleX(1.033); }
    39% { transform: translateY(0.49px) scaleX(1.037); stroke-width: 0.95; }
    45% { transform: translateY(0.48px) scaleX(1.036); }
    51% { transform: translateY(0.36px) scaleX(1.026); stroke-width: 0.975; }
    59% { transform: translateY(0.02px) scaleX(0.998); stroke-width: 1.008; }
    66% { transform: translateY(-0.15px) scaleX(0.984); }
    73% { transform: translateY(-0.09px) scaleX(0.991); stroke-width: 1; }
    80% { transform: translateY(0.06px) scaleX(1.006); }
    87% { transform: translateY(0.03px) scaleX(1.003); }
    93% { transform: translateY(-0.02px) scaleX(0.998); }
  }

  @keyframes resonate-mid {
    0%, 100% { transform: translateY(0) scaleX(1); stroke-width: 1; }
    14% { transform: translateY(0.03px) scaleX(1.01); }
    26% { transform: translateY(0.11px) scaleX(1.03); stroke-width: 0.99; }
    36% { transform: translateY(0.16px) scaleX(1.048); }
    43% { transform: translateY(0.18px) scaleX(1.054); stroke-width: 0.955; }
    50% { transform: translateY(0.16px) scaleX(1.046); }
    57% { transform: translateY(0.08px) scaleX(1.022); stroke-width: 0.985; }
    64% { transform: translateY(-0.04px) scaleX(0.99); stroke-width: 1.01; }
    71% { transform: translateY(-0.06px) scaleX(0.984); }
    78% { transform: translateY(0.02px) scaleX(1.006); stroke-width: 1; }
    86% { transform: translateY(0.03px) scaleX(1.008); }
    94% { transform: translateY(-0.01px) scaleX(0.997); }
  }

  @keyframes resonate-ring {
    0%, 100% { transform: translateY(0) scale(1, 1); stroke-width: 1; }
    13% { transform: translateY(-0.06px) scale(1.005, 0.996); }
    25% { transform: translateY(-0.22px) scale(1.017, 0.986); stroke-width: 0.99; }
    35% { transform: translateY(-0.36px) scale(1.028, 0.975); }
    42% { transform: translateY(-0.42px) scale(1.033, 0.971); stroke-width: 0.955; }
    48% { transform: translateY(-0.41px) scale(1.032, 0.972); }
    55% { transform: translateY(-0.3px) scale(1.022, 0.981); stroke-width: 0.978; }
    62% { transform: translateY(0.02px) scale(0.998, 1.002); stroke-width: 1.01; }
    69% { transform: translateY(0.16px) scale(0.985, 1.016); }
    76% { transform: translateY(0.09px) scale(0.992, 1.009); stroke-width: 1; }
    83% { transform: translateY(-0.05px) scale(1.005, 0.995); }
    90% { transform: translateY(-0.03px) scale(1.003, 0.997); }
    96% { transform: translateY(0.01px) scale(0.999, 1.001); }
  }

  /* 맞닿는 지점에 남는 흔적 — 접촉 직전 스며들고 벌어질 때 번지며 사라진다 */
  @keyframes resonate-echo-a {
    0%, 30% { opacity: 0; transform: scaleX(0.86); }
    42% { opacity: 0.3; transform: scaleX(1); }
    50% { opacity: 0.26; transform: scaleX(1.04); }
    62% { opacity: 0.1; transform: scaleX(1.18); }
    72%, 100% { opacity: 0; transform: scaleX(1.28); }
  }

  @keyframes resonate-echo-b {
    0%, 34% { opacity: 0; transform: scale(0.94); }
    45% { opacity: 0.24; transform: scale(1.02); }
    54% { opacity: 0.18; transform: scale(1.07); }
    66% { opacity: 0.07; transform: scale(1.16); }
    76%, 100% { opacity: 0; transform: scale(1.22); }
  }

  @media (prefers-reduced-motion: reduce) {
    .top,
    .mid,
    .ring,
    .echo {
      animation: none;
    }

    .glyph svg {
      animation: quiet 2.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
  }

  @keyframes quiet {
    0%, 100% { opacity: 0.72; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
  <main class="stage">
    <figure class="glyph breath">
      <svg viewBox="0 0 12 12" aria-hidden="true">
        <line class="top" x1="4.5" y1="1.45" x2="7.5" y2="1.45"/>
        <line class="mid" x1="2.55" y1="3.5" x2="9.45" y2="3.5"/>
        <circle class="ring" cx="6" cy="8.05" r="2.6"/>
      </svg>
      <figcaption>숨결</figcaption>
    </figure>

    <figure class="glyph ripple">
      <svg viewBox="0 0 12 12" aria-hidden="true">
        <line class="top" x1="4.5" y1="1.45" x2="7.5" y2="1.45"/>
        <line class="mid" x1="2.55" y1="3.5" x2="9.45" y2="3.5"/>
        <circle class="ring" cx="6" cy="8.05" r="2.6"/>
      </svg>
      <figcaption>파장</figcaption>
    </figure>

    <figure class="glyph tune">
      <svg viewBox="0 0 12 12" aria-hidden="true">
        <line class="top" x1="4.5" y1="1.45" x2="7.5" y2="1.45"/>
        <line class="mid" x1="2.55" y1="3.5" x2="9.45" y2="3.5"/>
        <circle class="ring" cx="6" cy="8.05" r="2.6"/>
      </svg>
      <figcaption>조율</figcaption>
    </figure>

    <figure class="glyph resonate">
      <svg viewBox="0 0 12 12" aria-hidden="true">
        <line class="echo echo-a" x1="3.6" y1="2.5" x2="8.4" y2="2.5"/>
        <circle class="echo echo-b" cx="6" cy="8.05" r="3.15"/>
        <line class="top" x1="4.5" y1="1.45" x2="7.5" y2="1.45"/>
        <line class="mid" x1="2.55" y1="3.5" x2="9.45" y2="3.5"/>
        <circle class="ring" cx="6" cy="8.05" r="2.6"/>
      </svg>
      <figcaption>여운</figcaption>
    </figure>
  </main>
</body>
</html>
