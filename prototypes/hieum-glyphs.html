<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ㅎ 루프 비교 — 탄성 / 궤적 / 자성</title>
<style>
  :root {
    --bg: #121316;
    --ink: #e8e6e1;
    --muted: #8b8880;
    --rule: rgba(232, 230, 225, 0.08);
  }

  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Noto Sans KR", "Malgun Gothic", sans-serif;
  }

  body {
    display: grid;
    min-height: 100dvh;
    place-items: center;
    padding: 48px 24px;
  }

  .stage {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    justify-content: center;
    gap: 72px;
  }

  .glyph {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    color: var(--ink);
  }

  .glyph svg {
    display: block;
    width: 112px;
    height: 112px;
    overflow: visible;
  }

  .glyph figcaption {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    line-height: 1;
  }

  .hat,
  .ring,
  .ink {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transform-box: fill-box;
    transform-origin: center;
  }

  .ring-ghost { opacity: 0.28; }

  .pen-dot { fill: currentColor; }

  .pen {
    transform-box: view-box;
    transform-origin: 50% 62.92%;
  }

  /* 1 탄성 — 풀렸다 붙고, 오버슈트 후 호흡 */
  .assemble .hat { animation: assemble-hat 2.6s linear infinite; }
  .assemble .ring { animation: assemble-ring 2.6s linear infinite; }

  @keyframes assemble-hat {
    0%, 100% { transform: translateY(0) scaleX(1); }
    12% { transform: translateY(-5.6px) scaleX(0.7); }
    20% { transform: translateY(-30px) scaleX(0.12); }
    32% { transform: translateY(7.2px) scaleX(1.24); }
    40% { transform: translateY(-2.4px) scaleX(0.93); }
    48% { transform: translateY(0) scaleX(1); }
    62% { transform: translateY(2.6px) scaleX(1.08); }
    74% { transform: translateY(-0.8px) scaleX(0.98); }
    86%, 94% { transform: translateY(0) scaleX(1); }
  }

  @keyframes assemble-ring {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(0.8); }
    22% { transform: scale(0.1); }
    36% { transform: scale(1.2); }
    45% { transform: scale(0.94); }
    54% { transform: scale(1); }
    68% { transform: scale(1.07); }
    80% { transform: scale(0.97); }
    90% { transform: scale(1); }
  }

  /* 2 궤적 — 잉크가 ㅇ 을 돌고, 모자는 반대 위상으로 기울어진다 */
  .orbit .ink {
    stroke-dasharray: 36 64;
    animation: orbit-ink 3.2s linear infinite;
  }

  .orbit .pen { animation: orbit-pen 3.2s linear infinite; }
  .orbit .hat { animation: orbit-hat 3.2s linear infinite; }

  @keyframes orbit-ink { to { stroke-dashoffset: -100; } }
  @keyframes orbit-pen { to { transform: rotate(360deg); } }

  @keyframes orbit-hat {
    0%, 100% { transform: translateX(0) rotate(0deg) scaleX(1.1); }
    12.5% { transform: translateX(7.6px) rotate(7deg) scaleX(1.02); }
    25% { transform: translateX(10.8px) rotate(11deg) scaleX(1); }
    37.5% { transform: translateX(7.6px) rotate(7deg) scaleX(1); }
    50% { transform: translateX(0) rotate(0deg) scaleX(1); }
    62.5% { transform: translateX(-7.6px) rotate(-7deg) scaleX(1); }
    75% { transform: translateX(-10.8px) rotate(-11deg) scaleX(1); }
    87.5% { transform: translateX(-7.6px) rotate(-7deg) scaleX(1.02); }
  }

  /* 3 자성 — 서로 당기다가 정점에서 튕겨 나온다 */
  .magnet .hat { animation: magnet-hat 2.3s linear infinite; }
  .magnet .ring { animation: magnet-ring 2.3s linear infinite; }

  @keyframes magnet-hat {
    0%, 100% { transform: translateY(0) scaleX(1); }
    22% { transform: translateY(2.8px) scaleX(1.05); }
    38% { transform: translateY(13.2px) scaleX(1.26); }
    44%, 48% { transform: translateY(17.2px) scaleX(1.34); }
    54% { transform: translateY(-8.4px) scaleX(0.82); }
    64% { transform: translateY(2.4px) scaleX(1.07); }
    74%, 90% { transform: translateY(0) scaleX(1); }
  }

  @keyframes magnet-ring {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    28% { transform: translateY(-2.2px) scale(1.05, 0.95); }
    46% { transform: translateY(-12px) scale(1.18, 0.76); }
    52%, 56% { transform: translateY(-14.8px) scale(1.24, 0.68); }
    64% { transform: translateY(6.8px) scale(0.88, 1.18); }
    74% { transform: translateY(-1.4px) scale(1.04, 0.97); }
    84%, 92% { transform: translateY(0) scale(1, 1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hat,
    .ring,
    .ink,
    .pen {
      animation: none;
    }

    .glyph svg {
      animation: quiet 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
  }

  @keyframes quiet {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
  <main class="stage">
    <figure class="glyph assemble">
      <svg viewBox="0 0 12 12" aria-hidden="true">
        <line class="hat" x1="3.15" y1="1.65" x2="8.85" y2="1.65"/>
        <circle class="ring" cx="6" cy="7.55" r="3.15"/>
      </svg>
      <figcaption>탄성</figcaption>
    </figure>

    <figure class="glyph orbit">
      <svg viewBox="0 0 12 12" aria-hidden="true">
        <line class="hat" x1="3.15" y1="1.65" x2="8.85" y2="1.65"/>
        <circle class="ring ring-ghost" cx="6" cy="7.55" r="3.15"/>
        <circle class="ink" cx="6" cy="7.55" r="3.15" pathLength="100"/>
        <g class="pen">
          <circle class="pen-dot" cx="6" cy="4.4" r="0.82"/>
        </g>
      </svg>
      <figcaption>궤적</figcaption>
    </figure>

    <figure class="glyph magnet">
      <svg viewBox="0 0 12 12" aria-hidden="true">
        <line class="hat" x1="3.15" y1="1.65" x2="8.85" y2="1.65"/>
        <circle class="ring" cx="6" cy="7.55" r="3.15"/>
      </svg>
      <figcaption>자성</figcaption>
    </figure>
  </main>
</body>
</html>
