name: Desktop package checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS ARM64 package
            platform: macos
            architecture: arm64
            node_architecture: arm64
          - os: windows-latest
            label: Windows x64 package
            platform: windows
            architecture: x64
            node_architecture: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - name: Assert runner architecture
        env:
          EXPECTED_NODE_ARCH: ${{ matrix.node_architecture }}
        shell: bash
        run: |
          node -e "if (process.arch !== process.env.EXPECTED_NODE_ARCH) throw new Error('Expected ' + process.env.EXPECTED_NODE_ARCH + ', got ' + process.arch)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Verify native Windows atomic replacement
        if: matrix.platform == 'windows'
        working-directory: rhwp
        run: cargo test --locked --bin rhwp atomic_file::tests -- --nocapture

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install desktop dependencies
        run: npm ci

      - name: Build unsigned macOS test packages
        if: matrix.platform == 'macos'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: >-
          npm run dist:mac --
          -c.mac.identity=null
          -c.mac.hardenedRuntime=false
          -c.mac.notarize=false

      - name: Build unsigned Windows test installer
        if: matrix.platform == 'windows'
        shell: bash
        run: npm run dist:win

      - name: Verify packaged runtime files
        run: npm run verify:package

      - name: Verify installer set and architecture
        run: node scripts/verify-release-artifacts.mjs ${{ matrix.platform }} ${{ matrix.architecture }}

      - name: Verify Windows installer is unsigned by design
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Filter '*-x64.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one Windows x64 installer, found $($installers.Count)."
          }
          $signature = Get-AuthenticodeSignature -FilePath $installers[0].FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "The Windows installer must remain unsigned; status was $($signature.Status)."
          }
