name: Apply issue-6639 vpos patch

on:
  push:
    branches:
      - chore/editing-experience-2026-09-24
    paths:
      - .github/patches/**
      - .github/workflows/apply-issue-6639-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/editing-experience-2026-09-24
          fetch-depth: 0
      - name: Apply product patch via Git Data API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: chore/editing-experience-2026-09-24
        run: |
          set -euxo pipefail
          if [ ! -f .github/patches/08-text_editing.patch ]; then
            echo "partial patch set; skip apply"
            exit 0
          fi
          git apply .github/patches/0*.patch
          python3 -c "from pathlib import Path; p=Path('rhwp/tests/issue_6639_cell_para_format_vpos.rs'); t=p.read_text(); p.write_text(t.replace('어귃난다','어긋난다'))"
          git diff --stat
          python3 .github/patches/commit_via_api.py
