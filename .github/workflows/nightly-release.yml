name: Nightly desktop release

on:
  schedule:
    # 4:00am KST (GitHub Actions cron uses UTC).
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  verification-gate:
    name: Require successful Nightly verification for exact SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read

    steps:
      - name: Check exact SHA verification result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          successful_run_id="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=100" \
              --jq ".workflow_runs | map(select(.head_sha == \"${GITHUB_SHA}\" and .status == \"completed\" and .conclusion == \"success\")) | first | .id // empty"
          )"
          if [[ -z "${successful_run_id}" ]]; then
            echo "No successful completed Nightly verification run exists for ${GITHUB_SHA}." >&2
            exit 1
          fi
          echo "Nightly verification run ${successful_run_id} passed for ${GITHUB_SHA}."

  prepare:
    name: Prepare nightly identity
    needs: verification-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.identity.outputs.version }}
      date: ${{ steps.identity.outputs.date }}
      sha: ${{ steps.identity.outputs.sha }}
      short_sha: ${{ steps.identity.outputs.short_sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0

      - name: Reject vulnerable production dependency trees
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=low
          npm --prefix rhwp/rhwp-agent audit --omit=dev --audit-level=low
          npm --prefix rhwp/rhwp-studio audit --omit=dev --audit-level=low

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1

      - name: Cache cargo-audit executable
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2

      - name: Install pinned cargo-audit
        run: |
          if [[ "$(cargo audit --version 2>/dev/null || true)" != "cargo-audit 0.22.2" ]]; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi

      - name: Reject RustSec vulnerabilities and new warnings
        working-directory: rhwp
        run: |
          set -euo pipefail
          # Print accepted existing warnings, then fail if RustSec adds a new warning.
          cargo audit
          cargo audit --no-fetch -D warnings \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0206

      - name: Fetch current nightly tag
        run: git fetch origin tag nightly --no-tags || true

      - name: Compute nightly identity and notes
        id: identity
        run: |
          set -euo pipefail
          base_version="$(jq -r .version package.json)"
          date="$(date -u +%F)"
          compact_date="${date//-/}"
          sha="${GITHUB_SHA}"
          short_sha="${sha:0:7}"
          version="${base_version}-nightly.${compact_date}.${short_sha}"

          {
            echo "version=${version}"
            echo "date=${date}"
            echo "sha=${sha}"
            echo "short_sha=${short_sha}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "VERSION=${version}"
            echo "DATE=${date}"
            echo "SHA=${sha}"
            echo "SHORT_SHA=${short_sha}"
          } > nightly-identity.env

          {
            echo "# Rauhwpx nightly pre-release"
            echo
            echo "- UTC date: ${date}"
            echo "- Full SHA: ${sha}"
            echo "- Short SHA: ${short_sha}"
            echo "- Version: ${version}"
            echo
            echo "## Changelog"
            echo
            changelog=""
            if git rev-parse --verify --quiet refs/tags/nightly >/dev/null &&
              git merge-base --is-ancestor nightly HEAD; then
              changelog="$(git log nightly..HEAD --pretty=format:'- %s (%h)')"
            else
              changelog="$(git log -20 --pretty=format:'- %s (%h)')"
            fi
            if [[ -n "${changelog}" ]]; then
              printf '%s\n' "${changelog}"
            else
              echo "- No commits since the previous nightly."
            fi
          } > nightly-notes.md

      - name: Upload nightly identity
        uses: actions/upload-artifact@v4
        with:
          name: nightly-identity
          if-no-files-found: error
          path: |
            nightly-identity.env
            nightly-notes.md

  browserbase-live:
    name: Browserbase Stagehand live smoke
    if: github.repository == 'ghandhitechnology/Rauhwpx'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: rhwp/rhwp-agent/package-lock.json

      - name: Install production agent dependencies
        run: npm --prefix rhwp/rhwp-agent ci --omit=dev

      - name: Require Browserbase live-test secrets
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          for name in BROWSERBASE_API_KEY BROWSERBASE_PROJECT_ID GEMINI_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Required Browserbase live-test secret is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Run three fresh Stagehand sessions
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BROWSERBASE_SMOKE_URL: ${{ vars.BROWSERBASE_SMOKE_URL }}
        run: npm --prefix rhwp/rhwp-agent run test:browserbase:live

  macos:
    name: Build macOS nightly installers
    needs: [prepare, browserbase-live]
    runs-on: macos-15
    timeout-minutes: 90
    environment: macos-release

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - name: Assert macOS ARM64 runner
        run: |
          test "$(uname -m)" = arm64
          node -e "if (process.arch !== 'arm64') throw new Error('Expected Node arm64, got ' + process.arch)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build WASM engine
        working-directory: rhwp
        run: wasm-pack build --target web

      - name: Install studio and desktop dependencies
        run: |
          npm ci
          npm --prefix rhwp/rhwp-studio ci
          npm --prefix rhwp/rhwp-agent ci --omit=dev

      - name: Set nightly package version
        run: npm version --no-git-tag-version "${{ needs.prepare.outputs.version }}"

      - name: Verify Developer ID and Apple ID notarization secrets
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Required macos-release secret is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Build signed and notarized macOS installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_NAME: "TAEWOOK HA (C8M34MMT8W)"
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run dist:mac

      - name: Verify packaged runtime files
        run: npm run verify:package

      - name: Verify macOS artifact set and architecture
        run: node scripts/verify-release-artifacts.mjs macos arm64

      - name: Verify Developer ID signature and notarization
        env:
          EXPECTED_IDENTITY: "Developer ID Application: TAEWOOK HA (C8M34MMT8W)"
        run: |
          set -euo pipefail
          while IFS= read -r -d '' app_path; do
            codesign --verify --deep --strict --verbose=2 "${app_path}"
            signing_info="$(codesign -dv --verbose=4 "${app_path}" 2>&1)"
            printf '%s\n' "${signing_info}"
            if ! grep -F "Authority=${EXPECTED_IDENTITY}" <<<"${signing_info}"; then
              echo "App was not signed with ${EXPECTED_IDENTITY}: ${app_path}" >&2
              exit 1
            fi
            if grep -E 'Signature=(adhoc|unofficial)|Authority=Apple Development' <<<"${signing_info}"; then
              echo "Rejected development or ad-hoc signature: ${app_path}" >&2
              exit 1
            fi
            xcrun stapler validate "${app_path}"
          done < <(find release -type d -name 'Rauhwpx.app' -print0)

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-nightly
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml

  windows:
    name: Build Windows nightly installer
    needs: [prepare, browserbase-live]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - name: Assert Windows x64 runner
        shell: bash
        run: node -e "if (process.arch !== 'x64') throw new Error('Expected Node x64, got ' + process.arch)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build WASM engine
        working-directory: rhwp
        shell: bash
        run: wasm-pack build --target web

      - name: Install studio and desktop dependencies
        shell: bash
        run: |
          npm ci
          npm --prefix rhwp/rhwp-studio ci
          npm --prefix rhwp/rhwp-agent ci --omit=dev

      - name: Set nightly package version
        shell: bash
        run: npm version --no-git-tag-version "${{ needs.prepare.outputs.version }}"

      - name: Build Windows installer
        shell: bash
        run: npm run dist:win

      - name: Verify packaged runtime files
        shell: bash
        run: npm run verify:package

      - name: Verify Windows artifact set and architecture
        shell: bash
        run: node scripts/verify-release-artifacts.mjs windows x64

      - name: Verify Windows installer is unsigned by design
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Filter '*-x64.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one Windows x64 installer, found $($installers.Count)."
          }
          $signature = Get-AuthenticodeSignature -FilePath $installers[0].FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "The Windows installer must remain unsigned; status was $($signature.Status)."
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-nightly
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  publish:
    name: Publish nightly GitHub Release
    if: github.ref == 'refs/heads/main'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum ./*.dmg ./*.zip ./*.exe > SHA256SUMS.txt

      - name: Publish nightly GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source release/nightly-identity.env
          extras=()
          if [ -f release/latest-mac.yml ]; then extras+=(release/latest-mac.yml); fi
          if [ -f release/latest.yml ]; then extras+=(release/latest.yml); fi
          for blockmap in release/*.zip.blockmap; do
            if [ -f "${blockmap}" ]; then extras+=("${blockmap}"); fi
          done

          lookup_error="release/nightly-release-lookup.err"
          if existing_release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" --jq '.id' \
              2>"${lookup_error}"
          )"; then
            rm -f "${lookup_error}"
          elif grep -q 'HTTP 404' "${lookup_error}"; then
            existing_release_id=""
            rm -f "${lookup_error}"
          else
            cat "${lookup_error}" >&2
            exit 1
          fi
          if [[ -n "${existing_release_id}" ]]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${existing_release_id}"
          fi
          git tag -f nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force
          gh release create nightly \
            release/*.dmg \
            release/*.zip \
            release/*.exe \
            release/*.exe.blockmap \
            release/SHA256SUMS.txt \
            "${extras[@]}" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Rauhwpx nightly ${DATE} (${SHORT_SHA})" \
            --notes-file release/nightly-notes.md
