name: Publish cloud sandbox edge image

on:
  workflow_dispatch:
  push:
    tags:
      - 'cloud-sandbox-v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: cloud-sandbox-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Railway sandbox image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cloud/package-lock.json
            cloud/install/provider-runtime/package-lock.json
            rhwp/rhwp-studio/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build cloud runtime assets
        run: |
          wasm-pack build rhwp --target web
          cargo build --manifest-path rhwp/Cargo.toml --release --locked --bin rhwp
          npm --prefix cloud ci
          npm --prefix rhwp/rhwp-studio ci
          bash cloud/install/build-runtime-assets.sh

      - name: Verify cloud runtime
        run: npm --prefix cloud test

      - name: Build and smoke-test sandbox image
        run: |
          podman build --tag rauhwpx-cloud-sandbox-edge --file cloud/install/Containerfile.sandbox cloud
          podman run --rm --entrypoint node rauhwpx-cloud-sandbox-edge \
            --input-type=module -e 'import { parseConfig } from "/app/src/config.mjs";
          const config = parseConfig(process.env);
          if (config.runner !== "local") throw new Error("sandbox image must use the local runner");
          if (config.workerUid !== 1001) throw new Error("sandbox image must drop workers to uid 1001");'

      - name: Publish edge image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rauhwpx-cloud"
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          podman tag rauhwpx-cloud-sandbox-edge "$image:edge"
          podman push "$image:edge"

      - name: Make sandbox package public
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GHCR_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/packages/container/rauhwpx-cloud \
            --data '{"visibility":"public"}'
