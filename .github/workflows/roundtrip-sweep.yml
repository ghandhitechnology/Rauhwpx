name: Round-trip sweep

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: roundtrip-sweep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ir-field-sweep:
    name: Full IR field round-trip sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1

      - name: Run the full 803-lane release-profile gate
        working-directory: rhwp
        run: cargo test --locked --profile release-test --test ir_field_sweep_baseline -- --nocapture
