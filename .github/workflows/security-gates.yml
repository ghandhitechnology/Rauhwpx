name: Security and hostile-input checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-dependencies:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-agent/package-lock.json
            rhwp/rhwp-studio/package-lock.json

      - name: Reject vulnerable production dependency trees
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=low
          npm --prefix rhwp/rhwp-agent audit --omit=dev --audit-level=low
          npm --prefix rhwp/rhwp-studio audit --omit=dev --audit-level=low

      - name: Test release and package verifiers
        run: >-
          node --test
          scripts/ci-workflow-contracts.test.mjs
          scripts/verify-desktop-package.test.mjs
          scripts/verify-release-artifacts.test.mjs

  rust-dependencies:
    name: Rust production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1

      - name: Cache cargo-audit executable
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2

      - name: Install pinned cargo-audit
        run: |
          if [[ "$(cargo audit --version 2>/dev/null || true)" != "cargo-audit 0.22.2" ]]; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi

      - name: Reject RustSec vulnerabilities and new warnings
        working-directory: rhwp
        run: |
          set -euo pipefail
          # Print accepted existing warnings, then fail if RustSec adds a new warning.
          cargo audit
          cargo audit --no-fetch -D warnings \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0206

  parser-boundaries:
    name: Hostile document input boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1

      - name: Test parser allocation and archive limits
        working-directory: rhwp
        run: |
          set -euo pipefail
          cargo_test_output="$(mktemp)"
          trap 'rm -f "${cargo_test_output}"' EXIT
          cargo test --locked --lib parser:: 2>&1 | tee "${cargo_test_output}"
          if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "${cargo_test_output}"; then
            echo 'The parser filter did not run any tests.' >&2
            exit 1
          fi

      - name: Test bounded local-file ingestion
        working-directory: rhwp
        run: |
          set -euo pipefail
          cargo_test_output="$(mktemp)"
          trap 'rm -f "${cargo_test_output}"' EXIT
          cargo test --locked --bin rhwp cli_reader_rejects_oversized_files_before_unbounded_reading -- --nocapture 2>&1 | tee "${cargo_test_output}"
          if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "${cargo_test_output}"; then
            echo 'The bounded-ingestion filter did not run any tests.' >&2
            exit 1
          fi

      - name: Test hostile HML resource identifiers
        working-directory: rhwp
        run: |
          set -euo pipefail
          cargo_test_output="$(mktemp)"
          trap 'rm -f "${cargo_test_output}"' EXIT
          cargo test --locked --test issue_2743_hml_resource_id_limit -- --nocapture 2>&1 | tee "${cargo_test_output}"
          if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "${cargo_test_output}"; then
            echo 'The hostile-HML test target did not run any tests.' >&2
            exit 1
          fi

  auth-and-resource-boundaries:
    name: Auth and resource boundary regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: rhwp/rhwp-agent/package-lock.json

      - name: Install agent dependencies
        run: npm --prefix rhwp/rhwp-agent ci

      - name: Test hub auth, isolation, and resource limits
        run: |
          node --test --test-concurrency=1 \
            rhwp/rhwp-agent/tests/artifact-store.test.mjs \
            rhwp/rhwp-agent/tests/auth-run-registry.test.mjs \
            rhwp/rhwp-agent/tests/browserbase-sidecar.test.mjs \
            rhwp/rhwp-agent/tests/document-snapshot-manager.test.mjs \
            rhwp/rhwp-agent/tests/download-manager.test.mjs \
            rhwp/rhwp-agent/tests/hub-server-tenancy.test.mjs \
            rhwp/rhwp-agent/tests/hub-session-registry.test.mjs \
            rhwp/rhwp-agent/tests/mcp-stdio-tenancy.test.mjs \
            rhwp/rhwp-agent/tests/pi-manager.test.mjs \
            rhwp/rhwp-agent/tests/rau-credits-client.test.mjs \
            rhwp/rhwp-agent/tests/turn-process-lifecycle.test.mjs \
            rhwp/rhwp-agent/tests/windows-setup-hardening.test.mjs

      - name: Test hosted Rau authorization boundaries
        run: npm --prefix rhwp/rau-credits test

      - name: Test browser extension security boundaries
        run: |
          node --test \
            rhwp/rhwp-shared/security/*.test.js \
            rhwp/rhwp-chrome/sw/fetch-security.test.mjs \
            rhwp/rhwp-firefox/sw/fetch-security.test.mjs \
            rhwp/rhwp-safari/src/fetch-security.test.mjs
