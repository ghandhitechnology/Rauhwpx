name: Release desktop apps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0

      - name: Require a version tag matching package.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${expected#v}." >&2
            exit 1
          fi

      - name: Audit high and critical production advisories
        run: node scripts/audit-production.mjs

  verification:
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    name: Test tagged source (${{ matrix.shard }}/2)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: matrix.shard == 1
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - uses: ./.github/actions/setup-rust
        with:
          wasm: ${{ matrix.shard == 1 && 'true' || 'false' }}
          cache: verification-${{ matrix.shard }}

      - name: Install pinned nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest@0.9.143
          fallback: none

      - name: Cache cargo-audit executable
        if: matrix.shard == 1
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2

      - name: Install pinned cargo-audit
        if: matrix.shard == 1
        run: |
          if [[ "$(cargo audit --version 2>/dev/null || true)" != "cargo-audit 0.22.2" ]]; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi

      - name: Reject RustSec vulnerabilities and new warnings
        if: matrix.shard == 1
        working-directory: rhwp
        run: |
          set -euo pipefail
          # Print accepted existing warnings, then fail if RustSec adds a new warning.
          cargo audit
          cargo audit --no-fetch -D warnings \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0206

      - name: Test Rust workspace shard
        working-directory: rhwp
        run: cargo nextest run --locked --workspace --test-threads 4 --partition count:${{ matrix.shard }}/2

      - name: Test Rust documentation
        if: matrix.shard == 1
        working-directory: rhwp
        run: cargo test --locked --workspace --doc

      - name: Install application dependencies
        if: matrix.shard == 1
        run: npm run setup
      - name: Build WASM engine
        if: matrix.shard == 1
        run: npm run build:wasm
      - name: Check repository tooling and provider adapter types
        if: matrix.shard == 1
        run: |
          npm run test:ci
          npm --prefix rhwp/rhwp-agent run typecheck
          npm --prefix rhwp/rhwp-studio run e2e:check
      - name: Test browser integration
        if: matrix.shard == 1
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          "$PUPPETEER_EXECUTABLE_PATH" --version
          npm --prefix rhwp/rhwp-studio run test:browser

      - name: Test agent hub and process lifecycle
        if: matrix.shard == 1
        run: node --test --test-concurrency=1 rhwp/rhwp-agent/tests/*.test.mjs

      - name: Test hosted Rau authorization service
        if: matrix.shard == 1
        run: npm --prefix rhwp/rau-credits test

      - name: Test Studio
        if: matrix.shard == 1
        run: npm --prefix rhwp/rhwp-studio test

  macos:
    name: Build macOS installers
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 120
    environment: macos-release
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/package-desktop
        with:
          platform: macos
          artifact: macos-dist
          signed: 'true'
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          apple-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

  windows:
    name: Build Windows installers
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/package-desktop
        with:
          platform: windows
          artifact: windows-dist

  publish:
    name: Publish GitHub Release
    needs: [verification, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum ./*.dmg ./*.zip ./*.exe > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extras=()
          if [ -f release/latest-mac.yml ]; then extras+=(release/latest-mac.yml); fi
          if [ -f release/latest.yml ]; then extras+=(release/latest.yml); fi
          for blockmap in release/*.zip.blockmap; do
            if [ -f "${blockmap}" ]; then extras+=("${blockmap}"); fi
          done
          gh release create "${GITHUB_REF_NAME}" \
            release/*.dmg \
            release/*.zip \
            release/*.exe \
            release/*.exe.blockmap \
            release/SHA256SUMS.txt \
            "${extras[@]}" \
            --verify-tag \
            --generate-notes \
            --title "Rauhwpx ${GITHUB_REF_NAME}"
