name: Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 90
    environment: macos-release

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json

      - name: Require a version tag matching package.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import packageJson from './package.json' with { type: 'json' }
          const expectedTag = `v${packageJson.version}`
          if (process.env.RELEASE_TAG !== expectedTag) {
            console.error(`Tag ${process.env.RELEASE_TAG} does not match package version ${packageJson.version}.`)
            process.exit(1)
          }
          NODE

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build WASM engine
        working-directory: rhwp
        run: wasm-pack build --target web

      - name: Install studio and desktop dependencies
        run: |
          npm ci
          npm --prefix rhwp/rhwp-studio ci

      - name: Build signed macOS installers
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run dist:mac

      - name: Generate checksums
        run: |
          cd release
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extras=()
          if [ -f release/latest-mac.yml ]; then extras+=(release/latest-mac.yml); fi
          gh release create "${GITHUB_REF_NAME}" \
            release/*.dmg \
            release/*.zip \
            release/SHA256SUMS.txt \
            "${extras[@]}" \
            --verify-tag \
            --generate-notes \
            --title "Rauhwpx ${GITHUB_REF_NAME}"
