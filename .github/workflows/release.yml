name: Release desktop apps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0

      - name: Require a version tag matching package.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${expected#v}." >&2
            exit 1
          fi

      - name: Reject vulnerable production dependency trees
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=low
          npm --prefix rhwp/rhwp-agent audit --omit=dev --audit-level=low
          npm --prefix rhwp/rhwp-studio audit --omit=dev --audit-level=low

  verification:
    name: Test tagged source (${{ matrix.shard }}/2)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        if: matrix.shard == 1
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1

      - name: Install pinned nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest@0.9.143
          fallback: none

      - name: Cache cargo-audit executable
        if: matrix.shard == 1
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2

      - name: Install pinned cargo-audit
        if: matrix.shard == 1
        run: |
          if [[ "$(cargo audit --version 2>/dev/null || true)" != "cargo-audit 0.22.2" ]]; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi

      - name: Reject RustSec vulnerabilities and new warnings
        if: matrix.shard == 1
        working-directory: rhwp
        run: |
          set -euo pipefail
          # Print accepted existing warnings, then fail if RustSec adds a new warning.
          cargo audit
          cargo audit --no-fetch -D warnings \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0206

      - name: Test Rust workspace shard
        working-directory: rhwp
        run: cargo nextest run --locked --workspace --test-threads 4 --partition count:${{ matrix.shard }}/2

      - name: Test Rust documentation
        if: matrix.shard == 1
        working-directory: rhwp
        run: cargo test --locked --workspace --doc

      - name: Install application dependencies
        if: matrix.shard == 1
        run: |
          npm ci
          npm --prefix rhwp/rhwp-agent ci
          npm --prefix rhwp/rhwp-studio ci

      - name: Test agent hub and process lifecycle
        if: matrix.shard == 1
        run: node --test --test-concurrency=1 rhwp/rhwp-agent/tests/*.test.mjs

      - name: Test hosted Rau authorization service
        if: matrix.shard == 1
        run: npm --prefix rhwp/rau-credits test

      - name: Test Studio
        if: matrix.shard == 1
        run: npm --prefix rhwp/rhwp-studio test

  macos:
    name: Build macOS installers
    # Build while verification runs. Publishing still waits for both jobs.
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 90
    environment: macos-release

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - name: Assert macOS ARM64 runner
        run: |
          test "$(uname -m)" = arm64
          node -e "if (process.arch !== 'arm64') throw new Error('Expected Node arm64, got ' + process.arch)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install desktop dependencies
        run: npm ci

      - name: Verify Developer ID and Apple ID notarization secrets
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Required macos-release secret is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Build signed and notarized macOS installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_NAME: "TAEWOOK HA (C8M34MMT8W)"
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run dist:mac

      - name: Verify packaged runtime files
        run: npm run verify:package

      - name: Verify macOS artifact set and architecture
        run: node scripts/verify-release-artifacts.mjs macos arm64

      - name: Verify Developer ID signature and notarization
        env:
          EXPECTED_IDENTITY: "Developer ID Application: TAEWOOK HA (C8M34MMT8W)"
        run: |
          set -euo pipefail
          while IFS= read -r -d '' app_path; do
            codesign --verify --deep --strict --verbose=2 "${app_path}"
            signing_info="$(codesign -dv --verbose=4 "${app_path}" 2>&1)"
            printf '%s\n' "${signing_info}"
            if ! grep -F "Authority=${EXPECTED_IDENTITY}" <<<"${signing_info}"; then
              echo "App was not signed with ${EXPECTED_IDENTITY}: ${app_path}" >&2
              exit 1
            fi
            if grep -E 'Signature=(adhoc|unofficial)|Authority=Apple Development' <<<"${signing_info}"; then
              echo "Rejected development or ad-hoc signature: ${app_path}" >&2
              exit 1
            fi
            xcrun stapler validate "${app_path}"
          done < <(find release -type d -name 'Rauhwpx.app' -print0)

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml

  windows:
    name: Build unsigned Windows x64 installer
    # Build while verification runs. Publishing still waits for both jobs.
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - name: Assert Windows x64 runner
        shell: bash
        run: node -e "if (process.arch !== 'x64') throw new Error('Expected Node x64, got ' + process.arch)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install desktop dependencies
        shell: bash
        run: npm ci

      - name: Build Windows installer
        shell: bash
        run: npm run dist:win

      - name: Verify packaged runtime files
        shell: bash
        run: npm run verify:package

      - name: Verify Windows artifact set and architecture
        shell: bash
        run: node scripts/verify-release-artifacts.mjs windows x64

      - name: Verify Windows installer is unsigned by design
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Filter '*-x64.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one Windows x64 installer, found $($installers.Count)."
          }
          $signature = Get-AuthenticodeSignature -FilePath $installers[0].FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "The Windows installer must remain unsigned; status was $($signature.Status)."
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  publish:
    name: Publish GitHub Release
    needs: [verification, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum ./*.dmg ./*.zip ./*.exe > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extras=()
          if [ -f release/latest-mac.yml ]; then extras+=(release/latest-mac.yml); fi
          if [ -f release/latest.yml ]; then extras+=(release/latest.yml); fi
          for blockmap in release/*.zip.blockmap; do
            if [ -f "${blockmap}" ]; then extras+=("${blockmap}"); fi
          done
          gh release create "${GITHUB_REF_NAME}" \
            release/*.dmg \
            release/*.zip \
            release/*.exe \
            release/*.exe.blockmap \
            release/SHA256SUMS.txt \
            "${extras[@]}" \
            --verify-tag \
            --generate-notes \
            --title "Rauhwpx ${GITHUB_REF_NAME}"
