name: Release desktop apps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0

      - name: Require a version tag matching package.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${expected#v}." >&2
            exit 1
          fi

      - name: Require matching cloud release metadata
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { RAILWAY_DEFAULT_IMAGE } from './desktop/cloud-railway.mjs';
          import { RAILWAY_DEFAULT_IMAGE as HOSTED_RAILWAY_DEFAULT_IMAGE } from './rhwp/rau-credits/cloud-provisioner.mjs';
          const read = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const version = read('package.json').version;
          const cloud = read('cloud/package.json');
          const lock = read('cloud/package-lock.json');
          assert.equal(cloud.version, version, 'Cloud and desktop release versions must match');
          assert.equal(lock.version, version, 'Cloud lockfile version must match');
          assert.equal(lock.packages[''].version, version, 'Cloud lockfile root version must match');
          assert.equal(RAILWAY_DEFAULT_IMAGE, `ghcr.io/ghandhitechnology/rauhwpx-cloud:${version}`);
          assert.equal(HOSTED_RAILWAY_DEFAULT_IMAGE, RAILWAY_DEFAULT_IMAGE, 'Hosted and desktop cloud images must match');
          NODE

      - name: Audit high and critical production advisories
        run: node scripts/audit-production.mjs

  verification:
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    name: Test tagged source (${{ matrix.shard }}/2)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: matrix.shard == 1
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - uses: ./.github/actions/setup-rust
        with:
          wasm: ${{ matrix.shard == 1 && 'true' || 'false' }}
          cache: verification-${{ matrix.shard }}

      - name: Install pinned nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest@0.9.143
          fallback: none

      - name: Cache cargo-audit executable
        if: matrix.shard == 1
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2

      - name: Install pinned cargo-audit
        if: matrix.shard == 1
        run: |
          if [[ "$(cargo audit --version 2>/dev/null || true)" != "cargo-audit 0.22.2" ]]; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi

      - name: Reject RustSec vulnerabilities and new warnings
        if: matrix.shard == 1
        working-directory: rhwp
        run: |
          set -euo pipefail
          # Print accepted existing warnings, then fail if RustSec adds a new warning.
          cargo audit
          cargo audit --no-fetch -D warnings \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0206

      - name: Test Rust workspace shard
        working-directory: rhwp
        run: cargo nextest run --locked --workspace --test-threads 4 --partition count:${{ matrix.shard }}/2

      - name: Test Rust documentation
        if: matrix.shard == 1
        working-directory: rhwp
        run: cargo test --locked --workspace --doc

      - name: Install application dependencies
        if: matrix.shard == 1
        run: npm run setup
      - name: Build WASM engine
        if: matrix.shard == 1
        run: npm run build:wasm
      - name: Check repository tooling and provider adapter types
        if: matrix.shard == 1
        run: |
          npm run test:ci
          npm --prefix rhwp/rhwp-agent run typecheck
          npm --prefix rhwp/rhwp-studio run e2e:check
      - name: Test browser integration
        if: matrix.shard == 1
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          "$PUPPETEER_EXECUTABLE_PATH" --version
          npm --prefix rhwp/rhwp-studio run test:browser

      - name: Test agent hub and process lifecycle
        if: matrix.shard == 1
        run: node --test --test-concurrency=1 rhwp/rhwp-agent/tests/*.test.mjs

      - name: Test hosted Rau authorization service
        if: matrix.shard == 1
        run: npm --prefix rhwp/rau-credits test

      - name: Test Studio
        if: matrix.shard == 1
        run: npm --prefix rhwp/rhwp-studio test

  macos:
    name: Build macOS installers
    # Bundle the verified cloud runtimes while tagged-source verification runs.
    needs: [preflight, cloud]
    runs-on: macos-15
    timeout-minutes: 120
    environment: macos-release
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download bundled VPS runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: cloud-dist-*
          path: cloud/release
          merge-multiple: true
      - uses: ./.github/actions/package-desktop
        with:
          platform: macos
          artifact: macos-dist
          signed: 'true'
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          apple-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

  windows:
    name: Build Windows installers
    needs: [preflight, cloud]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download bundled VPS runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: cloud-dist-*
          path: cloud/release
          merge-multiple: true
      - uses: ./.github/actions/package-desktop
        with:
          platform: windows
          artifact: windows-dist

  linux:
    name: Build Linux installers (${{ matrix.arch }})
    needs: [preflight, cloud]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - uses: ./.github/actions/setup-rust
        with:
          wasm: 'true'
          cache: package

      - name: Install desktop dependencies
        run: |
          npm ci
          npm --prefix rhwp/rhwp-studio ci
          npm --prefix rhwp/rhwp-agent ci --omit=dev

      - name: Download bundled VPS runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: cloud-dist-*
          path: cloud/release
          merge-multiple: true

      - name: Build AppImage and Debian package
        run: npm run dist:linux:${{ matrix.arch }}

      - name: Verify Linux artifacts
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ "${EXPECTED_ARCH}" = arm64 ]; then
            test -f release/Rauhwpx-*-arm64.AppImage
            test -f release/Rauhwpx-*-arm64.deb
            test -f release/latest-linux-arm64.yml
          else
            test -f release/Rauhwpx-*-x86_64.AppImage
            test -f release/Rauhwpx-*-amd64.deb
            test -f release/latest-linux.yml
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux*.yml

  cloud:
    name: Build signed VPS runtime (${{ matrix.asset_arch }})
    needs: preflight
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            machine_arch: x86_64
            asset_arch: amd64
          - runner: ubuntu-24.04-arm
            machine_arch: aarch64
            asset_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cloud/package-lock.json
            cloud/install/provider-runtime/package-lock.json
            rhwp/rhwp-studio/package-lock.json

      - uses: ./.github/actions/setup-rust
        with:
          wasm: 'true'
          cache: cloud-release

      - name: Build WASM engine
        working-directory: rhwp
        run: wasm-pack build --target web

      - name: Build native reference extractor
        working-directory: rhwp
        run: cargo build --release --locked --bin rhwp

      - name: Install locked cloud and Studio dependencies
        run: |
          npm --prefix cloud ci
          npm --prefix rhwp/rhwp-studio ci

      - name: Build dedicated headless Studio runtime
        run: bash cloud/install/build-runtime-assets.sh

      - name: Install live display test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends x11-apps

      - name: Verify cloud runtime
        run: npm --prefix cloud test

      - name: Build and smoke-test worker image
        run: |
          podman build --tag rauhwpx-cloud-worker-release --file cloud/install/Containerfile.worker cloud
          podman run --rm --user 1000:1000 --entrypoint node \
            rauhwpx-cloud-worker-release /app/document-runtime/smoke.mjs

      # 앱 제공 샌드박스 이미지는 컨트롤 플레인과 워커를 한 컨테이너에서 돌린다.
      - name: Build and smoke-test app sandbox image
        run: |
          podman build --tag rauhwpx-cloud-sandbox-release --file cloud/install/Containerfile.sandbox cloud
          podman run --rm --entrypoint node rauhwpx-cloud-sandbox-release \
            --input-type=module -e 'import { parseConfig } from "/app/src/config.mjs";
          const config = parseConfig(process.env);
          if (config.runner !== "local") throw new Error("sandbox image must use the local runner");
          if (config.workerUid !== 1001) throw new Error("sandbox image must drop workers to uid 1001");
          console.log(JSON.stringify({ runner: config.runner, workerUid: config.workerUid }));'
          podman run --rm --user 1001:1001 \
            --env HOME=/tmp --env RAUHWpx_XVFB_CAPTURE_PROOF=1 \
            --volume "$PWD/cloud/tests:/app/tests:ro" \
            --entrypoint node rauhwpx-cloud-sandbox-release \
            --test /app/tests/xvfb-studio-capture-proof.test.mjs

      - name: Publish app sandbox architecture image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rauhwpx-cloud"
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          release_version="${GITHUB_REF_NAME#v}"
          podman tag rauhwpx-cloud-sandbox-release "$image:$release_version-$ASSET_ARCH"
          podman push "$image:$release_version-$ASSET_ARCH"
          podman tag rauhwpx-cloud-sandbox-release "$image:stable-$ASSET_ARCH"
          podman push "$image:stable-$ASSET_ARCH"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and sign cloud runtime
        run: bash cloud/install/package-release.sh "${{ matrix.machine_arch }}" release

      - name: Verify cloud release assets
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          asset="release/rauhwpx-cloud-linux-${ASSET_ARCH}.tar.gz"
          test -s "$asset"
          test -s "$asset.sha256"
          test -s "$asset.sigstore.json"
          (cd release && sha256sum --check "$(basename "$asset").sha256")
          cosign verify-blob "$asset" \
            --bundle "$asset.sigstore.json" \
            --certificate-identity-regexp '^https://github\.com/ghandhitechnology/Rauhwpx/\.github/workflows/release\.yml@refs/tags/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'

      - name: Upload cloud runtime
        uses: actions/upload-artifact@v4
        with:
          name: cloud-dist-${{ matrix.asset_arch }}
          if-no-files-found: error
          path: |
            release/rauhwpx-cloud-linux-${{ matrix.asset_arch }}.tar.gz
            release/rauhwpx-cloud-linux-${{ matrix.asset_arch }}.tar.gz.sha256
            release/rauhwpx-cloud-linux-${{ matrix.asset_arch }}.tar.gz.sigstore.json
            release/rauhwpx-cloud-bootstrap-linux-${{ matrix.asset_arch }}.tar.gz

  cloud-image:
    name: Publish multi-architecture cloud sandbox image
    needs: [verification, cloud]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Publish versioned and stable manifests
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rauhwpx-cloud"
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          release_version="${GITHUB_REF_NAME#v}"
          podman manifest create "$image:$release_version"
          podman manifest add "$image:$release_version" "docker://$image:$release_version-amd64"
          podman manifest add "$image:$release_version" "docker://$image:$release_version-arm64"
          podman manifest push --all "$image:$release_version" "docker://$image:$release_version"
          podman manifest push --all "$image:$release_version" "docker://$image:stable"

  publish:
    name: Publish GitHub Release
    needs: [verification, macos, windows, linux, cloud, cloud-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release
          checksum_inputs=(./*.dmg ./*.zip ./*.exe ./*.AppImage ./*.deb ./*.tar.gz)
          if [ "${#checksum_inputs[@]}" -eq 0 ]; then
            echo "No release artifacts were downloaded" >&2
            exit 1
          fi
          sha256sum "${checksum_inputs[@]}" > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          artifacts=(
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.tar.gz.sha256
            release/*.tar.gz.sigstore.json
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS.txt
          )
          gh release create "${GITHUB_REF_NAME}" \
            "${artifacts[@]}" \
            --verify-tag \
            --generate-notes \
            --title "Rauhwpx ${GITHUB_REF_NAME}"
