name: Release desktop apps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0

      - name: Require a version tag matching package.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${expected#v}." >&2
            exit 1
          fi

      - name: Reject vulnerable production dependency trees
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=low
          npm --prefix rhwp/rhwp-agent audit --omit=dev --audit-level=low
          npm --prefix rhwp/rhwp-studio audit --omit=dev --audit-level=low

  verification:
    name: Test tagged source
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Cache cargo-audit executable
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2

      - name: Install pinned cargo-audit
        run: |
          if [[ "$(cargo audit --version 2>/dev/null || true)" != "cargo-audit 0.22.2" ]]; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi

      - name: Reject RustSec vulnerabilities and new warnings
        working-directory: rhwp
        run: |
          set -euo pipefail
          # Print accepted existing warnings, then fail if RustSec adds a new warning.
          cargo audit
          cargo audit --no-fetch -D warnings \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0206

      - name: Test Rust workspace
        working-directory: rhwp
        run: cargo test --locked --workspace

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build WASM engine
        working-directory: rhwp
        run: wasm-pack build --target web

      - name: Install application dependencies
        run: |
          npm ci
          npm --prefix rhwp/rhwp-agent ci
          npm --prefix rhwp/rhwp-studio ci

      - name: Test agent hub and process lifecycle
        run: node --test --test-concurrency=1 rhwp/rhwp-agent/tests/*.test.mjs

      - name: Test hosted Rau authorization service
        run: npm --prefix rhwp/rau-credits test

      - name: Test and build Studio
        run: |
          npm --prefix rhwp/rhwp-studio test
          npm --prefix rhwp/rhwp-studio run build

  browserbase-live:
    name: Browserbase Stagehand live smoke
    if: github.repository == 'ghandhitechnology/Rauhwpx'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: rhwp/rhwp-agent/package-lock.json

      - name: Install production agent dependencies
        run: npm --prefix rhwp/rhwp-agent ci --omit=dev

      - name: Require Browserbase live-test secrets
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          for name in BROWSERBASE_API_KEY BROWSERBASE_PROJECT_ID GEMINI_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Required Browserbase live-test secret is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Run three fresh Stagehand sessions
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BROWSERBASE_SMOKE_URL: ${{ vars.BROWSERBASE_SMOKE_URL }}
        run: npm --prefix rhwp/rhwp-agent run test:browserbase:live

  macos:
    name: Build macOS installers
    needs: [preflight, verification, browserbase-live, cloud]
    runs-on: macos-15
    timeout-minutes: 90
    environment: macos-release

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - name: Assert macOS ARM64 runner
        run: |
          test "$(uname -m)" = arm64
          node -e "if (process.arch !== 'arm64') throw new Error('Expected Node arm64, got ' + process.arch)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install desktop dependencies
        run: npm ci

      - name: Download bundled VPS runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: cloud-dist-*
          path: cloud/release
          merge-multiple: true

      - name: Verify Developer ID and Apple ID notarization secrets
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Required macos-release secret is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Build signed and notarized macOS installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_NAME: "TAEWOOK HA (C8M34MMT8W)"
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run dist:mac

      - name: Verify packaged runtime files
        run: npm run verify:package

      - name: Verify macOS artifact set and architecture
        run: node scripts/verify-release-artifacts.mjs macos arm64

      - name: Verify Developer ID signature and notarization
        env:
          EXPECTED_IDENTITY: "Developer ID Application: TAEWOOK HA (C8M34MMT8W)"
        run: |
          set -euo pipefail
          while IFS= read -r -d '' app_path; do
            codesign --verify --deep --strict --verbose=2 "${app_path}"
            signing_info="$(codesign -dv --verbose=4 "${app_path}" 2>&1)"
            printf '%s\n' "${signing_info}"
            if ! grep -F "Authority=${EXPECTED_IDENTITY}" <<<"${signing_info}"; then
              echo "App was not signed with ${EXPECTED_IDENTITY}: ${app_path}" >&2
              exit 1
            fi
            if grep -E 'Signature=(adhoc|unofficial)|Authority=Apple Development' <<<"${signing_info}"; then
              echo "Rejected development or ad-hoc signature: ${app_path}" >&2
              exit 1
            fi
            xcrun stapler validate "${app_path}"
          done < <(find release -type d -name 'Rauhwpx.app' -print0)

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml

  windows:
    name: Build unsigned Windows x64 installer
    needs: [preflight, verification, browserbase-live, cloud]
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - name: Assert Windows x64 runner
        shell: bash
        run: node -e "if (process.arch !== 'x64') throw new Error('Expected Node x64, got ' + process.arch)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install desktop dependencies
        shell: bash
        run: npm ci

      - name: Download bundled VPS runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: cloud-dist-*
          path: cloud/release
          merge-multiple: true

      - name: Build Windows installer
        shell: bash
        run: npm run dist:win

      - name: Verify packaged runtime files
        shell: bash
        run: npm run verify:package

      - name: Verify Windows artifact set and architecture
        shell: bash
        run: node scripts/verify-release-artifacts.mjs windows x64

      - name: Verify Windows installer is unsigned by design
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Filter '*-x64.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one Windows x64 installer, found $($installers.Count)."
          }
          $signature = Get-AuthenticodeSignature -FilePath $installers[0].FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "The Windows installer must remain unsigned; status was $($signature.Status)."
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  linux:
    name: Build Linux installers (${{ matrix.arch }})
    needs: [preflight, cloud]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build WASM engine
        working-directory: rhwp
        run: wasm-pack build --target web

      - name: Install root dependencies
        run: npm ci

      - name: Download bundled VPS runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: cloud-dist-*
          path: cloud/release
          merge-multiple: true

      - name: Build AppImage and Debian package
        run: npm run dist:linux:${{ matrix.arch }}

      - name: Verify Linux artifacts
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ "${EXPECTED_ARCH}" = arm64 ]; then
            test -f release/Rauhwpx-*-arm64.AppImage
            test -f release/Rauhwpx-*-arm64.deb
            test -f release/latest-linux-arm64.yml
          else
            test -f release/Rauhwpx-*-x86_64.AppImage
            test -f release/Rauhwpx-*-amd64.deb
            test -f release/latest-linux.yml
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux*.yml

  cloud:
    name: Build signed VPS runtime (${{ matrix.asset_arch }})
    needs: preflight
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            machine_arch: x86_64
            asset_arch: amd64
          - runner: ubuntu-24.04-arm
            machine_arch: aarch64
            asset_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cloud/package-lock.json
            cloud/install/provider-runtime/package-lock.json
            rhwp/rhwp-studio/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build WASM engine
        working-directory: rhwp
        run: wasm-pack build --target web

      - name: Build native reference extractor
        working-directory: rhwp
        run: cargo build --release --locked --bin rhwp

      - name: Install locked cloud and Studio dependencies
        run: |
          npm --prefix cloud ci
          npm --prefix rhwp/rhwp-studio ci

      - name: Build dedicated headless Studio runtime
        run: bash cloud/install/build-runtime-assets.sh

      - name: Install live display test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends x11-apps

      - name: Verify cloud runtime
        run: npm --prefix cloud test

      - name: Build and smoke-test worker image
        run: |
          podman build --tag rauhwpx-cloud-worker-release --file cloud/install/Containerfile.worker cloud
          podman run --rm --user 1000:1000 --entrypoint node \
            rauhwpx-cloud-worker-release /app/document-runtime/smoke.mjs

      # 앱 제공 샌드박스 이미지는 컨트롤 플레인과 워커를 한 컨테이너에서 돌린다.
      - name: Build and smoke-test app sandbox image
        run: |
          podman build --tag rauhwpx-cloud-sandbox-release --file cloud/install/Containerfile.sandbox cloud
          podman run --rm --entrypoint node rauhwpx-cloud-sandbox-release \
            --input-type=module -e 'import { parseConfig } from "/app/src/config.mjs";
          const config = parseConfig(process.env);
          if (config.runner !== "local") throw new Error("sandbox image must use the local runner");
          if (config.workerUid !== 1001) throw new Error("sandbox image must drop workers to uid 1001");
          console.log(JSON.stringify({ runner: config.runner, workerUid: config.workerUid }));'

      - name: Publish app sandbox architecture image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rauhwpx-cloud"
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          podman tag rauhwpx-cloud-sandbox-release "$image:stable-$ASSET_ARCH"
          podman push "$image:stable-$ASSET_ARCH"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and sign cloud runtime
        run: bash cloud/install/package-release.sh "${{ matrix.machine_arch }}" release

      - name: Verify cloud release assets
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          asset="release/rauhwpx-cloud-linux-${ASSET_ARCH}.tar.gz"
          test -s "$asset"
          test -s "$asset.sha256"
          test -s "$asset.sigstore.json"
          (cd release && sha256sum --check "$(basename "$asset").sha256")
          cosign verify-blob "$asset" \
            --bundle "$asset.sigstore.json" \
            --certificate-identity-regexp '^https://github\.com/ghandhitechnology/Rauhwpx/\.github/workflows/release\.yml@refs/tags/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'

      - name: Upload cloud runtime
        uses: actions/upload-artifact@v4
        with:
          name: cloud-dist-${{ matrix.asset_arch }}
          if-no-files-found: error
          path: |
            release/rauhwpx-cloud-linux-${{ matrix.asset_arch }}.tar.gz
            release/rauhwpx-cloud-linux-${{ matrix.asset_arch }}.tar.gz.sha256
            release/rauhwpx-cloud-linux-${{ matrix.asset_arch }}.tar.gz.sigstore.json
            release/rauhwpx-cloud-bootstrap-linux-${{ matrix.asset_arch }}.tar.gz

  cloud-image:
    name: Publish multi-architecture cloud sandbox image
    needs: cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Publish stable manifest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rauhwpx-cloud"
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          podman manifest create "$image:stable"
          podman manifest add "$image:stable" "docker://$image:stable-amd64"
          podman manifest add "$image:stable" "docker://$image:stable-arm64"
          podman manifest push --all "$image:stable" "docker://$image:stable"

  publish:
    name: Publish GitHub Release
    needs: [macos, windows, linux, cloud, cloud-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release
          checksum_inputs=(./*.dmg ./*.zip ./*.exe ./*.AppImage ./*.deb ./*.tar.gz)
          if [ "${#checksum_inputs[@]}" -eq 0 ]; then
            echo "No release artifacts were downloaded" >&2
            exit 1
          fi
          sha256sum "${checksum_inputs[@]}" > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          artifacts=(
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.tar.gz.sha256
            release/*.tar.gz.sigstore.json
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS.txt
          )
          gh release create "${GITHUB_REF_NAME}" \
            "${artifacts[@]}" \
            --verify-tag \
            --generate-notes \
            --title "Rauhwpx ${GITHUB_REF_NAME}"
