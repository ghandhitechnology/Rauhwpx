name: Release desktop apps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Require a version tag matching package.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${expected#v}." >&2
            exit 1
          fi

  macos:
    name: Build macOS installers
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 90
    environment: macos-release

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build WASM engine
        working-directory: rhwp
        run: wasm-pack build --target web

      - name: Install studio and desktop dependencies
        run: |
          npm ci
          npm --prefix rhwp/rhwp-studio ci
          npm --prefix rhwp/rhwp-agent ci --omit=dev

      - name: Verify Developer ID and Apple ID notarization secrets
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Required macos-release secret is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Build signed and notarized macOS installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_NAME: "TAEWOOK HA (C8M34MMT8W)"
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run dist:mac

      - name: Verify Developer ID signature and notarization
        env:
          EXPECTED_IDENTITY: "Developer ID Application: TAEWOOK HA (C8M34MMT8W)"
        run: |
          set -euo pipefail
          while IFS= read -r -d '' app_path; do
            codesign --verify --deep --strict --verbose=2 "${app_path}"
            signing_info="$(codesign -dv --verbose=4 "${app_path}" 2>&1)"
            printf '%s\n' "${signing_info}"
            if ! grep -F "Authority=${EXPECTED_IDENTITY}" <<<"${signing_info}"; then
              echo "App was not signed with ${EXPECTED_IDENTITY}: ${app_path}" >&2
              exit 1
            fi
            if grep -E 'Signature=(adhoc|unofficial)|Authority=Apple Development' <<<"${signing_info}"; then
              echo "Rejected development or ad-hoc signature: ${app_path}" >&2
              exit 1
            fi
            xcrun stapler validate "${app_path}"
          done < <(find release -type d -name 'Rauhwpx.app' -print0)

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml

  windows:
    name: Build Windows installer
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build WASM engine
        working-directory: rhwp
        shell: bash
        run: wasm-pack build --target web

      - name: Install studio and desktop dependencies
        shell: bash
        run: |
          npm ci
          npm --prefix rhwp/rhwp-studio ci
          npm --prefix rhwp/rhwp-agent ci --omit=dev

      - name: Build Windows installer
        shell: bash
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum ./*.dmg ./*.zip ./*.exe > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extras=()
          if [ -f release/latest-mac.yml ]; then extras+=(release/latest-mac.yml); fi
          if [ -f release/latest.yml ]; then extras+=(release/latest.yml); fi
          for blockmap in release/*.zip.blockmap; do
            if [ -f "${blockmap}" ]; then extras+=("${blockmap}"); fi
          done
          gh release create "${GITHUB_REF_NAME}" \
            release/*.dmg \
            release/*.zip \
            release/*.exe \
            release/*.exe.blockmap \
            release/SHA256SUMS.txt \
            "${extras[@]}" \
            --verify-tag \
            --generate-notes \
            --title "Rauhwpx ${GITHUB_REF_NAME}"
