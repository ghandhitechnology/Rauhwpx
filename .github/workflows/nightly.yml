name: Nightly verification and release

on:
  schedule:
    # 03:00 Asia/Seoul (GitHub Actions cron uses UTC).
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engine:
    name: Rust engine and WASM build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          wasm: 'true'
          cache: verification

      - name: Install pinned nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest@0.9.143
          fallback: none

      - name: Cache cargo-audit executable
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2

      - name: Install pinned cargo-audit
        run: |
          if [[ "$(cargo audit --version 2>/dev/null || true)" != "cargo-audit 0.22.2" ]]; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi

      - name: Reject RustSec vulnerabilities and new warnings
        working-directory: rhwp
        run: |
          set -euo pipefail
          # Print accepted existing warnings, then fail if RustSec adds a new warning.
          cargo audit
          cargo audit --no-fetch -D warnings \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0206

      - name: Test Rust workspace in parallel
        working-directory: rhwp
        run: |
          cargo nextest run --locked --workspace --test-threads 4
          cargo test --locked --workspace --doc

      - name: Build WASM engine
        working-directory: rhwp
        run: wasm-pack build --target web
      - name: Share tested WASM build
        uses: actions/upload-artifact@v4
        with:
          name: tested-wasm
          path: rhwp/pkg
          if-no-files-found: error
          retention-days: 1

  app:
    needs: engine
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    name: Desktop, agent, and Studio checks
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rhwp/rhwp-studio/package-lock.json
            rhwp/rhwp-agent/package-lock.json

      - name: Use tested WASM build
        uses: actions/download-artifact@v4
        with:
          name: tested-wasm
          path: rhwp/pkg

      - name: Install dependencies
        run: npm run setup

      - name: Audit high and critical production advisories
        run: npm run audit:production

      - name: Report all production advisories for triage
        if: always()
        run: node scripts/audit-production.mjs --report

      - name: Check repository tooling and provider adapter types
        run: |
          npm run test:ci
          npm --prefix rhwp/rhwp-agent run typecheck
          npm --prefix rhwp/rhwp-studio run e2e:check

      - name: Test browser integration
        run: |
          "$PUPPETEER_EXECUTABLE_PATH" --version
          npm --prefix rhwp/rhwp-studio run test:browser

      - name: Check desktop and hub syntax
        run: |
          node --check desktop/main.mjs
          node --check desktop/agent-hub.mjs
          node --check desktop/session-manager.mjs
          node --check rhwp/rhwp-agent/server.mjs

      - name: Test agent hub and process lifecycle
        run: node --test --test-concurrency=1 rhwp/rhwp-agent/tests/*.test.mjs

      - name: Test hosted Rau authorization service
        run: npm --prefix rhwp/rau-credits test

      - name: Test Studio
        run: npm --prefix rhwp/rhwp-studio test

      - name: Build Studio
        run: npm --prefix rhwp/rhwp-studio run build

  hostile-input-smoke:
    name: Seeded hostile-input fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Build all parser fuzz targets
        working-directory: rhwp
        run: cargo +nightly fuzz build

      - name: Replay and mutate each seeded corpus
        working-directory: rhwp
        run: |
          set -euo pipefail
          for target in parse_hwp parse_hwp3 parse_hwpx parse_hml parse_wmf parse_ooxml_chart; do
            cargo +nightly fuzz run "${target}" "fuzz/corpus/${target}" -- \
              -runs=2000 \
              -max_total_time=30 \
              -rss_limit_mb=2048 \
              -timeout=30
          done

  prepare:
    name: Prepare nightly identity
    needs: [engine, app, hostile-input-smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.identity.outputs.version }}
      date: ${{ steps.identity.outputs.date }}
      sha: ${{ steps.identity.outputs.sha }}
      short_sha: ${{ steps.identity.outputs.short_sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0

      - name: Compute nightly identity and notes
        id: identity
        run: |
          set -euo pipefail
          base_version="$(jq -r .version package.json)"
          date="$(date -u +%F)"
          compact_date="${date//-/}"
          sha="${GITHUB_SHA}"
          short_sha="${sha:0:7}"
          version="${base_version}-nightly.${compact_date}.${short_sha}"

          {
            echo "version=${version}"
            echo "date=${date}"
            echo "sha=${sha}"
            echo "short_sha=${short_sha}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "VERSION=${version}"
            echo "DATE=${date}"
            echo "SHA=${sha}"
            echo "SHORT_SHA=${short_sha}"
          } > nightly-identity.env

          {
            echo "# Rauhwpx nightly pre-release"
            echo
            echo "- UTC date: ${date}"
            echo "- Full SHA: ${sha}"
            echo "- Short SHA: ${short_sha}"
            echo "- Version: ${version}"
            echo
            echo "## Changelog"
            echo
            changelog=""
            if git rev-parse --verify --quiet refs/tags/nightly >/dev/null &&
              git merge-base --is-ancestor nightly HEAD; then
              changelog="$(git log nightly..HEAD --pretty=format:'- %s (%h)')"
            else
              changelog="$(git log -20 --pretty=format:'- %s (%h)')"
            fi
            if [[ -n "${changelog}" ]]; then
              printf '%s\n' "${changelog}"
            else
              echo "- No commits since the previous nightly."
            fi
          } > nightly-notes.md

      - name: Upload nightly identity
        uses: actions/upload-artifact@v4
        with:
          name: nightly-identity
          if-no-files-found: error
          path: |
            nightly-identity.env
            nightly-notes.md

  macos:
    name: Build macOS installers
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 120
    environment: macos-release
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/package-desktop
        with:
          platform: macos
          artifact: macos-nightly
          version: ${{ needs.prepare.outputs.version }}
          signed: 'true'
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          apple-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

  windows:
    name: Build Windows installers
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/package-desktop
        with:
          platform: windows
          artifact: windows-nightly
          version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish nightly GitHub Release
    if: github.ref == 'refs/heads/main'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-nightly'
          path: release
          merge-multiple: true

      - name: Download nightly identity
        uses: actions/download-artifact@v4
        with:
          name: nightly-identity
          path: release

      - name: Generate checksums
        run: |
          cd release
          sha256sum ./*.dmg ./*.zip ./*.exe > SHA256SUMS.txt

      - name: Publish nightly GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source release/nightly-identity.env
          extras=()
          if [ -f release/latest-mac.yml ]; then extras+=(release/latest-mac.yml); fi
          if [ -f release/latest.yml ]; then extras+=(release/latest.yml); fi
          for blockmap in release/*.zip.blockmap; do
            if [ -f "${blockmap}" ]; then extras+=("${blockmap}"); fi
          done

          lookup_error="release/nightly-release-lookup.err"
          if existing_release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" --jq '.id' \
              2>"${lookup_error}"
          )"; then
            rm -f "${lookup_error}"
          elif grep -q 'HTTP 404' "${lookup_error}"; then
            existing_release_id=""
            rm -f "${lookup_error}"
          else
            cat "${lookup_error}" >&2
            exit 1
          fi
          if [[ -n "${existing_release_id}" ]]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${existing_release_id}"
          fi
          git tag -f nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force
          gh release create nightly \
            release/*.dmg \
            release/*.zip \
            release/*.exe \
            release/*.exe.blockmap \
            release/SHA256SUMS.txt \
            "${extras[@]}" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Rauhwpx nightly ${DATE} (${SHORT_SHA})" \
            --notes-file release/nightly-notes.md
