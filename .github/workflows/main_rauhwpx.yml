# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - Rauhwpx

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout
    outputs:
      has_dotnet: ${{ steps.probe.outputs.has_dotnet }}

    steps:
      - uses: actions/checkout@v4

      # Portal-generated ASP.NET workflow. This repository is Rust/Node and has
      # no .csproj/.sln, so `dotnet build` cannot succeed. Skip rather than
      # fail every main push. setup-dotnet rejects `dotnet10.x`; the supported
      # form is `10.x`.
      - name: Detect a .NET project
        id: probe
        shell: bash
        run: |
          if find . \( -name '*.csproj' -o -name '*.sln' \) | grep -q .; then
            echo "has_dotnet=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .NET project in this repository; skipping ASP.NET build."
            echo "has_dotnet=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET Core
        if: steps.probe.outputs.has_dotnet == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        if: steps.probe.outputs.has_dotnet == 'true'
        run: dotnet build --configuration Release

      - name: dotnet publish
        if: steps.probe.outputs.has_dotnet == 'true'
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        if: steps.probe.outputs.has_dotnet == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    if: needs.build.outputs.has_dotnet == 'true'
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F1B1C06FBE3642B6A8D49B91FED70D3E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_992D24680F06437095AD6C8212A74F4D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_25D4CA5CECE44199B90A8627814B3E2A }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Rauhwpx'
          slot-name: 'Production'
          package: .
