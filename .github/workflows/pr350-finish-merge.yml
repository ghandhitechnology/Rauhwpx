name: Finish #350 main merge

on:
  push:
    paths:
      - .github/workflows/pr350-finish-merge.yml

permissions:
  contents: write

concurrency:
  group: pr350-finish-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: cursor/fix-7333-footer-shapes-ce21
      - name: Merge main and restore #7333 layout
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- rhwp/src/renderer/layout/shape_layout.rs rhwp/src/renderer/layout/table_cell_content.rs
          if ! git diff --cached --quiet; then
            git commit -m "chore(renderer): match main on remaining #344 conflict files"
          fi
          git merge --no-edit origin/main
          patch -p1 --forward < .github/pr350-merge/shape_layout.7333.patch
          patch -p1 --forward < .github/pr350-merge/table_cell_content.7333.patch
          patch -p1 --forward < .github/pr350-merge/layout.7333.patch
          git add rhwp/src/renderer/layout/shape_layout.rs rhwp/src/renderer/layout/table_cell_content.rs rhwp/src/renderer/layout.rs
          git rm -f .github/workflows/pr350-finish-merge.yml \
            .github/pr350-merge/shape_layout.7333.patch \
            .github/pr350-merge/table_cell_content.7333.patch \
            .github/pr350-merge/layout.7333.patch
          rmdir .github/pr350-merge || true
          git commit -m "fix(renderer): restore #7333 footer layout after the main merge"
          git push origin HEAD:cursor/fix-7333-footer-shapes-ce21
