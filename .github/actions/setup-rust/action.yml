name: Rust build setup
description: Install the pinned toolchain and reuse Cargo dependencies and build outputs.
inputs:
  wasm:
    description: Install the WASM target and wasm-pack.
    default: 'false'
  cache:
    description: Separate incompatible build profiles.
    required: true
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: 1.93.1
        targets: ${{ inputs.wasm == 'true' && 'wasm32-unknown-unknown' || '' }}
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/wasm-pack*
          rhwp/target
        key: cargo-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ inputs.cache }}-${{ hashFiles('rhwp/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ inputs.cache }}-${{ hashFiles('rhwp/Cargo.lock') }}-
    - name: Install wasm-pack
      if: inputs.wasm == 'true'
      shell: bash
      run: |
        if [[ "$(wasm-pack --version 2>/dev/null || true)" != 'wasm-pack 0.15.0' ]]; then
          cargo install wasm-pack --version 0.15.0 --locked --force
        fi
